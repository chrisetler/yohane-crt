; HDR output for the Yohane CRT mod. Needs an HDR display with "Use HDR" turned on in
; Windows display settings. "enabled" takes effect when the game starts; F8 rereads the rest.
; F6 in game switches highlights off and on, for comparing against the SDR look.

enabled=0

; Brightness of SDR white (HUD, menus, cutscenes, and the level before the filter), in nits.
; Match it to what looks right next to the Windows desktop; 200 is a common choice.
paper_white=200

; Display peak brightness in nits, or "auto" to use what the display reports.
; Highlights roll off smoothly toward this instead of clipping.
peak=auto

; Linear brightness gain on the CRT filter's output. 1.0 = the same average brightness as SDR
; but without clipping the bright mask stripes; higher makes the lit scanlines glow past paper
; white the way a real tube's beams did. Try 1.5 to 3.
crt_boost=1.5
